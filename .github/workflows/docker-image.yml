name: Build and publish the image

# Publishes to GitHub's own container registry, so the compose example in the
# README actually works for someone who has not cloned the repository. Without
# this, `image: censarr:latest` means "a local image called censarr" and
# `docker compose up` fails with "pull access denied" - which is not an obvious
# error to read.
#
# GHCR rather than Docker Hub because it needs no account, no secret and no
# setup: GITHUB_TOKEN is issued to the job automatically.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation changes do not need a 4GB rebuild.
    paths-ignore:
      - "**.md"
      - "docs/images/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Two pushes in quick succession used to build in parallel, both racing to
# write :latest - and whichever finished last won, not whichever was newer. A
# slow first build could therefore leave :latest pointing at the older commit,
# silently, with both runs green.
#
# One at a time per branch, and a new push cancels the one it supersedes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}
  # Surfaced here because the `secrets` context cannot be tested in a step's
  # `if:`. Empty when Docker Hub has not been set up, which is how the mirror
  # gets skipped rather than failing the build.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    # Two images from one Dockerfile. The default has CUDA for an NVIDIA GPU;
    # the -cpu tags are the same build on plain Ubuntu, a fraction of the size,
    # for a machine with no GPU.
    name: Build (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            base: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
            suffix: ""
          - variant: cpu
            base: ubuntu:22.04
            suffix: "-cpu"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner ships with a few GB of toolchains this build never uses, and
      # the CUDA base layer alone is over 4GB. Reclaiming the space first is
      # cheaper than debugging a "no space left on device" halfway through.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is a mirror, not the primary. Linking a GitHub account to
      # Docker Hub does not publish anything by itself - automated builds are
      # a paid feature - so this pushes with an access token instead.
      #
      # The whole step is skipped when the secrets are absent, so the build
      # never fails just because Docker Hub was not set up.
      - name: Sign in to Docker Hub
        id: dockerhub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Both registries get the same tags. docker/metadata-action takes a
          # list, and build-push-action pushes to every name it produces.
          # The project was called Cleanarr: installs pulling the old name
          # keep getting updates, under the same tags.
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/cleanarr
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ steps.dockerhub.outcome == 'success' }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/cleanarr,enable=${{ steps.dockerhub.outcome == 'success' }}
          # Every tag is written out with this variant's suffix, and nothing
          # is left to be added automatically: an automatic "latest" carries
          # no suffix, so the CPU build would overwrite the GPU image's.
          # "latest" moves with the default branch and with a version tag
          # that is not a pre-release.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,suffix=${{ matrix.suffix }},enable={{is_default_branch}}
            type=raw,value=latest,suffix=${{ matrix.suffix }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile expects the repository root, because it copies both
          # server/ and web/.
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
          # amd64 only: the base image is nvidia/cuda, which has no arm64 build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per variant, or each build would evict the other's.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
